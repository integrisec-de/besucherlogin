name: Shell-Lint

# Haelt die Skripte gesund, die auf Kundensystemen ausgefuehrt werden.
#
# Anlass: appliance/setup.sh war ueber drei Monate syntaktisch kaputt und damit
# nicht ausfuehrbar - ein ASCII-Anfuehrungszeichen (U+0022) stand als Schluss-
# zeichen hinter einem typografischen U+201E. Das faellt niemandem auf, solange
# niemand die Skripte laufen laesst. Genau das soll hier nicht mehr passieren.

on:
  push:
    paths:
      - '**.sh'
      - '.github/workflows/shell-lint.yml'
  pull_request:
    paths:
      - '**.sh'
      - '.github/workflows/shell-lint.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Skripte auflisten
        run: find . -path ./.git -prune -o -type f -name '*.sh' -print | sort

      # 1) Syntax. Haette den setup.sh-Fehler am Tag des Commits gemeldet.
      - name: Syntax (bash -n)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if bash -n "$f"; then
              echo "  ok      $f"
            else
              echo "  FEHLER  $f"
              fail=1
            fi
          done < <(find . -path ./.git -prune -o -type f -name '*.sh' -print0)
          exit "$fail"

      # 2) Gekippte Anfuehrungszeichen - die eigentliche Ursache.
      #    Typografische Zeichen gehoeren paarweise auf eine Zeile. Eine
      #    ungerade Anzahl heisst, dass die Gegenseite ein ASCII-" ist, das den
      #    Bash-String vorzeitig beendet. bash -n meldet nur den Folgefehler,
      #    diese Regel benennt die Ursache. Python statt awk, weil mawk auf den
      #    Runnern nicht multibyte-fest ist.
      - name: Gekippte Anfuehrungszeichen
        run: |
          python3 - <<'PY'
          import pathlib, sys
          TYPO = "\u201E\u201C\u201D"          # oeffnend und schliessend
          bad = 0
          for p in sorted(pathlib.Path(".").rglob("*.sh")):
              if ".git" in p.parts:
                  continue
              text = p.read_text(encoding="utf-8", errors="replace")
              for n, line in enumerate(text.splitlines(), 1):
                  c = sum(line.count(ch) for ch in TYPO)
                  if c % 2 == 1:
                      print(f"  VERDACHT  {p}:{n}  ({c} typografisches Zeichen, unpaarig)")
                      print(f"            {line.strip()[:120]}")
                      bad += 1
          if bad:
              print(f"\n{bad} Verdachtsfall(e). Pruefen, ob ein ASCII-\" gemeint war.")
              sys.exit(1)
          print("  ok  keine unpaarigen typografischen Anfuehrungszeichen")
          PY

      # 3) shellcheck. Vorerst nicht blockierend: der Bestand ist noch nicht
      #    darauf getrimmt, und ein Workflow, der ab Tag eins rot ist, wird
      #    ignoriert. Sobald die Meldungen abgearbeitet sind, hier
      #    continue-on-error entfernen.
      - name: shellcheck (Bericht)
        continue-on-error: true
        run: |
          shellcheck --version
          find . -path ./.git -prune -o -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck --external-sources --severity=warning
