name: Appliance-Image

# Baut & pusht das On-Prem-Image nach GHCR, sobald ein Versions-Tag gepusht wird:
#   git tag v1.0.0 && git push origin v1.0.0
# Ergebnis:  ghcr.io/<owner>/besucherlogin:v1.0.0  +  :latest
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags/Labels ableiten
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/besucherlogin
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest
          # Ohne diese Angaben ueberschreibt die Action die LABEL-Zeilen aus dem
          # Containerfile mit Repo-Name und englischer GitHub-Beschreibung.
          labels: |
            org.opencontainers.image.title=Besucherlogin
            org.opencontainers.image.description=DSGVO-konformes Besuchermanagement (Node + node:sqlite), self-hosted
            org.opencontainers.image.vendor=integrisec

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: appliance/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
