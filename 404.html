<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Seite nicht gefunden – Besucherlogin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
  <style>
    @font-face { font-family:'Outfit'; font-weight:700; font-display:swap; src:url('/assets/fonts/outfit-700.woff2') format('woff2'); }
    @font-face { font-family:'Outfit'; font-weight:800; font-display:swap; src:url('/assets/fonts/outfit-800.woff2') format('woff2'); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",sans-serif;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#0e1e3d;
      background-image:radial-gradient(ellipse 70% 70% at 50% 28%,rgba(26,79,214,.42) 0%,transparent 55%),
                       radial-gradient(ellipse 40% 45% at 85% 82%,rgba(0,200,150,.14) 0%,transparent 55%);
      color:#fff; text-align:center; padding:32px;
    }
    .wrap { max-width:540px; }
    .brand { display:flex; align-items:center; justify-content:center; gap:10px; margin:0 auto 34px; }
    .brand .shield { height:30px; width:auto; }
    .brand .word { font-size:1.5rem; font-weight:700; color:#fff; letter-spacing:-.5px; }
    .code { font-size:clamp(72px,17vw,128px); font-weight:800; line-height:1; letter-spacing:-3px; color:#00c896; }
    h1 { font-size:clamp(20px,4vw,28px); font-weight:700; letter-spacing:-.5px; margin:6px 0 12px; }
    p { color:rgba(255,255,255,.6); font-size:16px; font-weight:300; line-height:1.65; margin-bottom:30px; }
    .btn {
      display:inline-flex; align-items:center; gap:8px;
      background:#00c896; color:#06281d; font-weight:700; font-size:.98rem;
      padding:13px 26px; border-radius:9px; text-decoration:none;
      transition:background .2s, transform .15s, box-shadow .2s;
    }
    .btn:hover { background:#00e0a8; transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,200,150,.32); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="word">Besucherlogin</span></div>
    <div class="code">404</div>
    <h1>Seite nicht gefunden</h1>
    <p>Die aufgerufene Seite existiert nicht oder wurde verschoben. Bitte prüfen Sie die Adresse oder kehren Sie zur Startseite zurück.</p>
    <a class="btn" href="/">Zur Startseite →</a>
  </div>
</body>
</html>
